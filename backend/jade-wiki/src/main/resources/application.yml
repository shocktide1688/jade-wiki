quarkus:
  application:
    name: jade-wiki
    version: 0.1.0

  http:
    host: 0.0.0.0
    port: 8082
    auth:
      permission:
        mcp:
          paths: /mcp,/mcp/*
          policy: authenticated
    cors:
      origins: http://localhost:5173
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: accept,authorization,content-type,x-requested-with,x-trace-id,x-idempotency-key,x-share-token
      exposed-headers: x-trace-id

  datasource:
    db-kind: postgresql
    # jade-wiki 独立 DB (与底座 jade_admin / jade_demo 隔离), 端口 5434
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    jdbc:
      url: "${DB_URL:jdbc:postgresql://localhost:5434/jade_wiki?currentSchema=public}"
      max-size: 20
      min-size: 2
    devservices:
      enabled: false

  hibernate-orm:
    database:
      generation: validate
    log:
      sql: false
    jdbc:
      timezone: Asia/Shanghai

  flyway:
    migrate-at-start: true
    # 多数据库支持: jade.db.vendor = postgresql | mysql | sqlite, 对应 db/migration/<vendor>/
    # 第二位置: jade-mcp 基座模块自带的 mcp_token 迁移
    locations: classpath:db/migration/${jade.db.vendor},classpath:com/jade/mcp/db/migration/${jade.db.vendor}
    baseline-on-migrate: true
    validate-on-migrate: false

  smallrye-openapi:
    enable: true

  smallrye-health:
    root-path: /q/health


  micrometer:
    binder:
      jvm: true
      system: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s,5s
    export:
      prometheus:
        path: /q/metrics

  log:
    level: INFO
    console:
      format: "%d{HH:mm:ss.SSS} %-5p [%X{traceId}] %c{1.} - %m%n"
    category:
      org.hibernate.orm.jdbc:
        level: WARN
      org.hibernate.engine.transaction:
        level: WARN
      org.hibernate.resource.jdbc:
        level: WARN
      io.netty:
        level: WARN
      io.vertx:
        level: WARN

mp:
  openapi:
    info:
      title: Jade Wiki API
      version: 0.1.0
      description: Jade Wiki —— 类 ShowDoc 的 API 文档管理系统
  jwt:
    verify:
      issuer: jade-wiki
      publickey:
        location: META-INF/jwt-public.pem

smallrye:
  jwt:
    sign:
      key:
        location: META-INF/jwt-private.pem
    new-token:
      issuer: jade-wiki
      lifetime: 7200

jade:
  jwt:
    secret: "${JADE_JWT_SECRET:dev-only-change-me-in-prod-min-32-bytes-required!!}"
    expire-seconds: "${JADE_JWT_EXPIRE_SECONDS:7200}"
    issuer: "${JADE_JWT_ISSUER:jade-wiki}"
  crypto:
    master-key: "${JADE_CRYPTO_MASTER_KEY:dev-only-aes-key-32-bytes-required-please!!}"
  cors:
    enabled: "${JADE_CORS_ENABLED:true}"
  db:
    vendor: "${JADE_DB_VENDOR:postgresql}"
  mcp:
    enabled: true
    path: /mcp
  wiki:
    upload-dir: "${JADE_UPLOAD_DIR:./data/uploads}"

"%dev":
  quarkus:
    dev-ui:
      enabled: false
    continuous-testing:
      enabled: DISABLED
    hibernate-orm:
      log:
        sql: true
    log:
      level: INFO
      category:
        org.hibernate.SQL:
          level: DEBUG
        org.hibernate.orm.jdbc.bind:
          level: TRACE
        org.hibernate.engine.transaction:
          level: WARN

"%prod":
  quarkus:
    hibernate-orm:
      log:
        sql: false
  jade:
    jwt:
      secret: "${JADE_JWT_SECRET}"
      expire-seconds: "${JADE_JWT_EXPIRE_SECONDS}"
      issuer: "${JADE_JWT_ISSUER}"
    crypto:
      master-key: "${JADE_CRYPTO_MASTER_KEY}"

# ============ 多数据库 profile ============
# 启动方式: -Dquarkus.profile=mysql / -Dquarkus.profile=sqlite (或环境变量 QUARKUS_PROFILE)
"%mysql":
  jade:
    db:
      vendor: mysql
  quarkus:
    datasource:
      db-kind: mysql
      username: "${DB_USERNAME:root}"
      password: "${DB_PASSWORD:postgres}"
      jdbc:
        url: "${DB_URL:jdbc:mysql://localhost:3307/jade_wiki?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
        max-size: 20
        min-size: 2
    hibernate-orm:
      database:
        generation: none

"%sqlite":
  jade:
    db:
      vendor: sqlite
  quarkus:
    datasource:
      db-kind: sqlite
      jdbc:
        # date_class=text: xerial 驱动默认把 Timestamp 存成毫秒整数, text 模式按 ISO 存储(与 Hibernate SQLiteDialect 读写格式一致)
        url: "${DB_URL:jdbc:sqlite:./data/jade_wiki.db?journal_mode=WAL&busy_timeout=5000&date_class=text}"
        max-size: 4
        min-size: 1
    hibernate-orm:
      database:
        generation: none
      dialect: org.hibernate.community.dialect.SQLiteDialect
