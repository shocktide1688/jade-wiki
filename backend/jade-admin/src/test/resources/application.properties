# ============ 测试环境配置 ============
# jade-admin 跑独立 DB (jade_admin), 跟 jade-demo 完全隔离
# CI: services.postgres.initdb.sql 预先创建两个 db: jade_demo + jade_admin
# 本地: docker exec -u postgres jade-postgres psql -c "CREATE DATABASE jade_admin;"
# 应急: TEST_DB_URL=jdbc:postgresql://localhost:5432/jade_admin mvn test
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/jade_admin?currentSchema=public}
quarkus.datasource.jdbc.max-size=8

# Flyway 跑迁移（保证表结构）
quarkus.flyway.migrate-at-start=true
# 多数据库: 默认 postgresql, SQLite 冒烟测试用 -Djade.db.vendor=sqlite 覆盖
jade.db.vendor=postgresql
quarkus.flyway.locations=classpath:db/migration/${jade.db.vendor},classpath:com/jade/mail/db/migration/${jade.db.vendor},classpath:com/jade/ldapclient/db/migration/${jade.db.vendor}
quarkus.flyway.baseline-on-migrate=true
# V1-V3 是在 demo 模块里, admin 只有 V4-V7
# 测试场景不重新跑 V1-V3, baseline 已有
quarkus.flyway.validate-on-migrate=false
quarkus.flyway.clean-at-start=false
quarkus.flyway.clean-disabled=true

# Hibernate 校验不阻塞（DB 已有表）
quarkus.hibernate-orm.database.generation=none

# JWT（测试用固定密钥）
jade.jwt.secret=test-only-jwt-secret-min-32-bytes-required-please-ok
jade.jwt.issuer=jade-platform
jade.jwt.expire-seconds=7200

# MP-JWT 验证 (sign + verify 用同一个 in-memory keypair, 启动时由 Quarkus 生成)
# 关键: 验证 issuer 必须跟 sign 的 issuer 一致 (jade-platform)
mp.jwt.verify.issuer=jade-platform
# 测试不需要 aud 校验
mp.jwt.verify.audiences=

# 字段加密 (32 字节)
jade.crypto.master-key=0123456789abcdef0123456789abcdef

# Test 端口默认 8080 (与 RestAssured 一致, CI 也用 8080)
# 如本地有别的进程占 8080, 启动测试前 docker stop jade-demo
quarkus.http.test-port=8085

# Quarkus dev/test 关掉 health check 干扰
quarkus.smallrye-health.ui.always-include=false

# 详细日志（看 PUT 500 错）
quarkus.log.level=DEBUG
quarkus.log.category."com.jade.admin".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
