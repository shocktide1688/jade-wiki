name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.backend == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    env:
      # jade-wiki 测试库（admin 测试库同库不同 schema 互不影响, 用独立库最稳）
      TEST_DB_URL: jdbc:postgresql://localhost:5432/jade_wiki
      WIKI_TEST_DB_URL: jdbc:postgresql://localhost:5432/jade_wiki
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jade_wiki
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Create admin test database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d jade_wiki -c "CREATE DATABASE jade_admin;" || true
      - name: Build & Test
        run: |
          cd backend
          mvn -B clean verify 2>&1 | tee /tmp/mvn-build.log
          MAVEN_EXIT=${PIPESTATUS[0]}
          echo "maven exit code: $MAVEN_EXIT"
          if [ $MAVEN_EXIT -ne 0 ]; then
            echo "::group::maven build log (tail 200)"
            tail -200 /tmp/mvn-build.log
            echo "::endgroup::"
            exit $MAVEN_EXIT
          fi

  frontend:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.frontend == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm install --no-audit --no-fund
      - name: Type check
        run: cd frontend && npm run type-check
      - name: Build
        run: cd frontend && npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
