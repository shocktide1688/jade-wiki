name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.backend == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    env:
      # jade-wiki 测试库（admin 测试库同库不同 schema 互不影响, 用独立库最稳）
      TEST_DB_URL: jdbc:postgresql://localhost:5432/jade_wiki
      WIKI_TEST_DB_URL: jdbc:postgresql://localhost:5432/jade_wiki
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jade_wiki
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Create admin test database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d jade_wiki -c "CREATE DATABASE jade_admin;" || true
      - name: Build & Test
        run: |
          cd backend
          mvn -B clean verify 2>&1 | tee /tmp/mvn-build.log
          MAVEN_EXIT=${PIPESTATUS[0]}
          echo "maven exit code: $MAVEN_EXIT"
          if [ $MAVEN_EXIT -ne 0 ]; then
            echo "::group::maven build log (tail 200)"
            tail -200 /tmp/mvn-build.log
            echo "::endgroup::"
            exit $MAVEN_EXIT
          fi

  frontend:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.frontend == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm install --no-audit --no-fund
      - name: Type check
        run: cd frontend && npm run type-check
      - name: Build
        run: cd frontend && npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  publish:
    # 只依赖 backend (frontend 镜像直接从源码构建, 不用 frontend job 的 artifact;
    # needs frontend 会被 paths-filter 的 skip 连坐导致 publish 不跑)
    needs: [backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shocktide1688/jade-wiki-jvm
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/jade-wiki/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shocktide1688/jade-wiki-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ GraalVM Native 镜像 (双 runner matrix, 无 QEMU) ============
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            db_kind: sqlite
          - platform: linux/amd64
            runner: ubuntu-latest
            db_kind: postgresql
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            db_kind: sqlite
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            db_kind: postgresql
    runs-on: ${{ matrix.runner }}
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push API image by digest
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/jade-wiki/Dockerfile.native
          target: api
          platforms: ${{ matrix.platform }}
          build-args: DB_KIND=${{ matrix.db_kind }}
          push: true
          outputs: type=image,name=ghcr.io/shocktide1688/jade-wiki-native-${{ matrix.db_kind }},push-by-digest=true,name-canonical=true
      - name: Build and push all-in-one image by digest
        id: push-aio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/jade-wiki/Dockerfile.native
          target: all-in-one
          platforms: ${{ matrix.platform }}
          build-args: DB_KIND=${{ matrix.db_kind }}
          push: true
          outputs: type=image,name=ghcr.io/shocktide1688/jade-wiki-${{ matrix.db_kind }},push-by-digest=true,name-canonical=true
      - name: Export digests
        run: |
          mkdir -p /tmp/digests/native-${{ matrix.db_kind }} /tmp/digests/aio-${{ matrix.db_kind }}
          # 文件名不能含冒号: 去掉 sha256: 前缀, 合并时拼接回去
          API_D=$(echo "${{ steps.push-api.outputs.digest }}" | sed 's/sha256://')
          AIO_D=$(echo "${{ steps.push-aio.outputs.digest }}" | sed 's/sha256://')
          echo "${{ steps.push-api.outputs.digest }}" > "/tmp/digests/native-${{ matrix.db_kind }}/$API_D"
          echo "${{ steps.push-aio.outputs.digest }}" > "/tmp/digests/aio-${{ matrix.db_kind }}/$AIO_D"
      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-aio-${{ matrix.db_kind }}-${{ matrix.runner }}
          path: /tmp/digests/aio-${{ matrix.db_kind }}/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload native digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-native-${{ matrix.db_kind }}-${{ matrix.runner }}
          path: /tmp/digests/native-${{ matrix.db_kind }}/*
          if-no-files-found: error
          retention-days: 1

  merge-native:
    needs: [build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Merge manifest — jade-wiki-native (纯后端, sqlite 自托管)
        working-directory: /tmp/digests/digests-native-sqlite
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shocktide1688/jade-wiki-native:sqlite \
            $(printf 'ghcr.io/shocktide1688/jade-wiki-native@sha256:%s ' *)
      - name: Merge manifest — jade-wiki-native (纯后端, postgresql 生产)
        working-directory: /tmp/digests/digests-native-postgresql
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shocktide1688/jade-wiki-native:latest \
            -t ghcr.io/shocktide1688/jade-wiki-native:pg \
            -t ghcr.io/shocktide1688/jade-wiki-native:sha-${GITHUB_SHA::7} \
            $(printf 'ghcr.io/shocktide1688/jade-wiki-native@sha256:%s ' *)
      - name: Merge manifest — jade-wiki (all-in-one sqlite 自托管)
        working-directory: /tmp/digests/digests-aio-sqlite
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shocktide1688/jade-wiki:latest \
            -t ghcr.io/shocktide1688/jade-wiki:sha-${GITHUB_SHA::7} \
            $(printf 'ghcr.io/shocktide1688/jade-wiki@sha256:%s ' *)
      - name: Merge manifest — jade-wiki (all-in-one postgresql)
        working-directory: /tmp/digests/digests-aio-postgresql
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shocktide1688/jade-wiki:pg \
            $(printf 'ghcr.io/shocktide1688/jade-wiki@sha256:%s ' *)
