# =====================================================
# Prometheus 抓取配置
# =====================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # jade-wiki 业务服务 (8082)
  - job_name: 'jade-demo'
    metrics_path: /q/metrics
    static_configs:
      - targets: ['localhost:8082']
    scrape_timeout: 5s

  # jade-admin 管理底座 (随 jade-wiki 运行)
  - job_name: 'jade-admin'
    metrics_path: /q/metrics
    static_configs:

    scrape_timeout: 5s

  # prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
